<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Random Polygon Canvas</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
  }
  canvas {
    display: block;
  }
  #regen {
    padding: 10px 16px;
    font-family: sans-serif;
    font-size: 14px;
    background: #222;
    color: #eee;
    border: 1px solid #555;
    border-radius: 6px;
    cursor: pointer;
  }
  #regen:hover {
    background: #333;
  }
  #controls {
    position: fixed;
    top: 16px;
    left: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: sans-serif;
    font-size: 13px;
    color: #eee;
  }
  #radius {
    width: 140px;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="controls">
  <button id="regen">New Polygon</button>
  <label>Points <span id="pointCountValue">10</span>
    <input type="range" id="pointCount" min="3" max="20" value="10">
  </label>
  <label>Corner radius <span id="radiusValue">30</span>%
    <input type="range" id="radius" min="0" max="100" value="30">
  </label>
  <label><input type="checkbox" id="showPoints" checked> Show points</label>
  <label><input type="checkbox" id="snapToGrid"> Snap to grid</label>
</div>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', () => {
    resize();
    drawPolygon();
  });
  resize();

  const GRID_STEP = 40;

  function drawGrid() {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.06)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let x = 0; x < canvas.width; x += GRID_STEP) {
      ctx.moveTo(x + 0.5, 0);
      ctx.lineTo(x + 0.5, canvas.height);
    }
    for (let y = 0; y < canvas.height; y += GRID_STEP) {
      ctx.moveTo(0, y + 0.5);
      ctx.lineTo(canvas.width, y + 0.5);
    }
    ctx.stroke();
  }

  function snapToGrid(p) {
    return {
      x: Math.round(p.x / GRID_STEP) * GRID_STEP,
      y: Math.round(p.y / GRID_STEP) * GRID_STEP
    };
  }

  // Generate N random points, then sort them by angle around their
  // centroid. Connecting points in angular order around a common center
  // guarantees a simple (non-self-intersecting) polygon.
  function generatePolygon(n) {
    const margin = Math.min(canvas.width, canvas.height) * 0.12;
    const points = [];
    for (let i = 0; i < n; i++) {
      let p = {
        x: margin + Math.random() * (canvas.width - 2 * margin),
        y: margin + Math.random() * (canvas.height - 2 * margin)
      };
      if (snapToGridInput.checked) p = snapToGrid(p);
      points.push(p);
    }

    const cx = points.reduce((sum, p) => sum + p.x, 0) / n;
    const cy = points.reduce((sum, p) => sum + p.y, 0) / n;

    points.sort((a, b) => {
      return Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx);
    });

    // Each vertex gets its own random weight so corners round by
    // different amounts once scaled by the corner-radius slider.
    for (const p of points) {
      p.radiusFactor = 0.4 + Math.random() * 0.6;
    }

    return points;
  }

  const EPS = 1e-6;

  // The largest radius that still fits at this corner: the arc's tangent
  // points would otherwise pass the midpoint of an adjacent edge. Since
  // tangent distance is radius / tan(angle/2), that cap depends on the
  // interior angle at the corner (prev–curr–next), not just edge length —
  // a plain "half the shorter edge" limit only holds at exactly 90° and
  // lets sharper or wider corners overshoot.
  function maxCornerRadius(prev, curr, next) {
    const v1x = prev.x - curr.x, v1y = prev.y - curr.y;
    const v2x = next.x - curr.x, v2y = next.y - curr.y;
    const d1 = Math.hypot(v1x, v1y);
    const d2 = Math.hypot(v2x, v2y);
    if (d1 <= EPS || d2 <= EPS) return 0;

    const cosA = Math.min(1, Math.max(-1, (v1x * v2x + v1y * v2y) / (d1 * d2)));
    if (cosA <= -1 + EPS) return Infinity; // ~180°: virtually no bend, unlimited

    const sinA = Math.abs(v1x * v2y - v1y * v2x) / (d1 * d2);
    const tanHalfAngle = sinA / (1 + cosA);
    const maxTangentDist = Math.min(d1, d2) / 2;
    return tanHalfAngle * maxTangentDist;
  }

  // Traces a polygon's outline with each corner rounded to `percent`
  // (0-1) of the largest radius that corner can geometrically hold, each
  // further scaled by that vertex's own weight in `radiusFactors`. Built
  // on ctx.arcTo, which draws an arc tangent to the incoming and outgoing
  // edges at a given vertex.
  //
  // arcTo needs the path's current point to sit exactly at the arc's
  // true tangent distance from the corner, which depends on the corner's
  // angle (see maxCornerRadius above). Rather than compute that by hand,
  // start on a point guaranteed to already be on an edge (a midpoint) and
  // let each arcTo figure out its own tangent points; arcTo draws the
  // straight run-up to them automatically.
  function tracePolygonPath(ctx, points, percent, radiusFactors) {
    const n = points.length;
    const startX = (points[n - 1].x + points[0].x) / 2;
    const startY = (points[n - 1].y + points[0].y) / 2;

    ctx.beginPath();
    ctx.moveTo(startX, startY);

    for (let i = 0; i < n; i++) {
      const prev = points[(i - 1 + n) % n];
      const curr = points[i];
      const next = points[(i + 1) % n];
      const factor = Array.isArray(radiusFactors) ? radiusFactors[i] : 1;
      const maxR = maxCornerRadius(prev, curr, next);
      const r = Number.isFinite(maxR) ? maxR * percent * factor : 0;

      ctx.arcTo(curr.x, curr.y, next.x, next.y, r);
    }

    ctx.lineTo(startX, startY);
    ctx.closePath();
  }

  let currentPoints = [];

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (snapToGridInput.checked) drawGrid();

    const percent = Number(radiusInput.value) / 100;
    const radiusFactors = currentPoints.map(p => p.radiusFactor);

    tracePolygonPath(ctx, currentPoints, percent, radiusFactors);

    ctx.fillStyle = 'rgba(80, 160, 255, 0.25)';
    ctx.fill();

    if (showPointsInput.checked) {
      ctx.fillStyle = '#ffffff';
      for (const p of currentPoints) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }

  function drawPolygon() {
    currentPoints = generatePolygon(Number(pointCountInput.value));
    render();
  }

  const radiusInput = document.getElementById('radius');
  const radiusValue = document.getElementById('radiusValue');
  const showPointsInput = document.getElementById('showPoints');
  const pointCountInput = document.getElementById('pointCount');
  const pointCountValue = document.getElementById('pointCountValue');
  const snapToGridInput = document.getElementById('snapToGrid');

  document.getElementById('regen').addEventListener('click', drawPolygon);
  radiusInput.addEventListener('input', () => {
    radiusValue.textContent = radiusInput.value;
    render();
  });
  showPointsInput.addEventListener('change', render);
  pointCountInput.addEventListener('input', () => {
    pointCountValue.textContent = pointCountInput.value;
    drawPolygon();
  });
  snapToGridInput.addEventListener('change', () => {
    if (snapToGridInput.checked) {
      currentPoints = currentPoints.map(p => ({ ...snapToGrid(p), radiusFactor: p.radiusFactor }));
    }
    render();
  });

  // Dragging vertices: hit-test against currentPoints, then move
  // whichever one is grabbed and re-render so the arcs update live.
  // Connectivity (array order) is fixed once dragging starts, so a
  // vertex always stays joined to the same two neighbors — dragging it
  // across an edge will visibly self-intersect rather than silently
  // reassigning which points it connects to.
  const HIT_RADIUS = 14;
  let draggingPoint = null;

  function pointFromEvent(evt) {
    const rect = canvas.getBoundingClientRect();
    return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
  }

  function findPointAt(pos) {
    return currentPoints.find(p => Math.hypot(p.x - pos.x, p.y - pos.y) <= HIT_RADIUS) || null;
  }

  canvas.addEventListener('pointerdown', (evt) => {
    const pos = pointFromEvent(evt);
    const hit = findPointAt(pos);
    if (!hit) return;
    draggingPoint = hit;
    canvas.setPointerCapture(evt.pointerId);
    canvas.style.cursor = 'grabbing';
  });

  canvas.addEventListener('pointermove', (evt) => {
    const pos = pointFromEvent(evt);
    if (draggingPoint) {
      let next = {
        x: Math.min(Math.max(pos.x, 0), canvas.width),
        y: Math.min(Math.max(pos.y, 0), canvas.height)
      };
      if (snapToGridInput.checked) next = snapToGrid(next);
      draggingPoint.x = next.x;
      draggingPoint.y = next.y;
      render();
    } else {
      canvas.style.cursor = findPointAt(pos) ? 'grab' : 'default';
    }
  });

  function releaseDrag(evt) {
    if (!draggingPoint) return;
    canvas.releasePointerCapture(evt.pointerId);
    draggingPoint = null;
    canvas.style.cursor = 'default';
  }
  canvas.addEventListener('pointerup', releaseDrag);
  canvas.addEventListener('pointercancel', releaseDrag);

  drawPolygon();
</script>
</body>
</html>
