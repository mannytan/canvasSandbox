<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Random Polygon Canvas</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #111;
  }
  canvas {
    display: block;
  }
  #regen {
    padding: 10px 16px;
    font-family: sans-serif;
    font-size: 14px;
    background: #222;
    color: #eee;
    border: 1px solid #555;
    border-radius: 6px;
    cursor: pointer;
  }
  #regen:hover {
    background: #333;
  }
  #controls {
    position: fixed;
    top: 16px;
    left: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: sans-serif;
    font-size: 13px;
    color: #eee;
  }
  #radius {
    width: 140px;
  }
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="controls">
  <button id="regen">New Polygon</button>
  <label>Corner radius <span id="radiusValue">18</span>px
    <input type="range" id="radius" min="0" max="60" value="18">
  </label>
</div>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', () => {
    resize();
    drawPolygon();
  });
  resize();

  // Generate N random points, then sort them by angle around their
  // centroid. Connecting points in angular order around a common center
  // guarantees a simple (non-self-intersecting) polygon.
  function generatePolygon(n) {
    const margin = Math.min(canvas.width, canvas.height) * 0.12;
    const points = [];
    for (let i = 0; i < n; i++) {
      points.push({
        x: margin + Math.random() * (canvas.width - 2 * margin),
        y: margin + Math.random() * (canvas.height - 2 * margin)
      });
    }

    const cx = points.reduce((sum, p) => sum + p.x, 0) / n;
    const cy = points.reduce((sum, p) => sum + p.y, 0) / n;

    points.sort((a, b) => {
      return Math.atan2(a.y - cy, a.x - cx) - Math.atan2(b.y - cy, b.x - cx);
    });

    // Each vertex gets its own random weight so corners round by
    // different amounts once scaled by the corner-radius slider.
    for (const p of points) {
      p.radiusFactor = 0.4 + Math.random() * 0.6;
    }

    return points;
  }

  // Traces a polygon's outline with each corner rounded to its own
  // radius. `radii` is either a single number applied to every vertex,
  // or an array with one radius per vertex (radii[i] rounds points[i]).
  // Built on ctx.arcTo, which draws an arc tangent to the incoming and
  // outgoing edges at a given vertex.
  //
  // arcTo needs the path's current point to sit exactly at the arc's
  // true tangent distance from the corner — and that distance is
  // radius / tan(interior angle / 2), not the radius itself (they only
  // match at a 90° corner). Rather than compute that angle-dependent
  // offset by hand, start on a point guaranteed to already be on an
  // edge (a midpoint) and let each arcTo figure out its own tangent
  // points; arcTo draws the straight run-up to them automatically.
  function tracePolygonPath(ctx, points, radii) {
    const n = points.length;
    const startX = (points[n - 1].x + points[0].x) / 2;
    const startY = (points[n - 1].y + points[0].y) / 2;

    ctx.beginPath();
    ctx.moveTo(startX, startY);

    for (let i = 0; i < n; i++) {
      const prev = points[(i - 1 + n) % n];
      const curr = points[i];
      const next = points[(i + 1) % n];
      const wanted = Array.isArray(radii) ? radii[i] : radii;

      const d1 = Math.hypot(curr.x - prev.x, curr.y - prev.y);
      const d2 = Math.hypot(next.x - curr.x, next.y - curr.y);
      // Clamp so a corner's radius never eats past the midpoint of
      // either adjacent edge (avoids overlapping arcs on short sides).
      const r = Math.max(0, Math.min(wanted, d1 / 2, d2 / 2));

      ctx.arcTo(curr.x, curr.y, next.x, next.y, r);
    }

    ctx.lineTo(startX, startY);
    ctx.closePath();
  }

  let currentPoints = [];

  function render() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const maxRadius = Number(radiusInput.value);
    const radii = currentPoints.map(p => p.radiusFactor * maxRadius);

    tracePolygonPath(ctx, currentPoints, radii);

    ctx.fillStyle = 'rgba(80, 160, 255, 0.25)';
    ctx.fill();

    ctx.strokeStyle = '#5aa0ff';
    ctx.lineWidth = 2;
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    for (const p of currentPoints) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawPolygon() {
    currentPoints = generatePolygon(10);
    render();
  }

  const radiusInput = document.getElementById('radius');
  const radiusValue = document.getElementById('radiusValue');

  document.getElementById('regen').addEventListener('click', drawPolygon);
  radiusInput.addEventListener('input', () => {
    radiusValue.textContent = radiusInput.value;
    render();
  });

  // Dragging vertices: hit-test against currentPoints, then move
  // whichever one is grabbed and re-render so the arcs update live.
  // Connectivity (array order) is fixed once dragging starts, so a
  // vertex always stays joined to the same two neighbors — dragging it
  // across an edge will visibly self-intersect rather than silently
  // reassigning which points it connects to.
  const HIT_RADIUS = 14;
  let draggingPoint = null;

  function pointFromEvent(evt) {
    const rect = canvas.getBoundingClientRect();
    return { x: evt.clientX - rect.left, y: evt.clientY - rect.top };
  }

  function findPointAt(pos) {
    return currentPoints.find(p => Math.hypot(p.x - pos.x, p.y - pos.y) <= HIT_RADIUS) || null;
  }

  canvas.addEventListener('pointerdown', (evt) => {
    const pos = pointFromEvent(evt);
    const hit = findPointAt(pos);
    if (!hit) return;
    draggingPoint = hit;
    canvas.setPointerCapture(evt.pointerId);
    canvas.style.cursor = 'grabbing';
  });

  canvas.addEventListener('pointermove', (evt) => {
    const pos = pointFromEvent(evt);
    if (draggingPoint) {
      draggingPoint.x = Math.min(Math.max(pos.x, 0), canvas.width);
      draggingPoint.y = Math.min(Math.max(pos.y, 0), canvas.height);
      render();
    } else {
      canvas.style.cursor = findPointAt(pos) ? 'grab' : 'default';
    }
  });

  function releaseDrag(evt) {
    if (!draggingPoint) return;
    canvas.releasePointerCapture(evt.pointerId);
    draggingPoint = null;
    canvas.style.cursor = 'default';
  }
  canvas.addEventListener('pointerup', releaseDrag);
  canvas.addEventListener('pointercancel', releaseDrag);

  drawPolygon();
</script>
</body>
</html>
